<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guessing Games</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Start Interface -->
  <section id="start-screen" class="active">
    <h1>Welcome to Guessing Games </h1>
    <p>Test your knowledge of countries, celebrities, and cars!</p>
    <button id="start-btn">Start Game</button>
  </section>

  <!-- Main Game Interface (Hidden Initially) -->
  <div id="game-container" style="display:none;">
    <header>
      <h1>Guessing Games</h1>
      <p>Coins: <span id="coins">100</span></p>
    </header>

    <nav>
      <button id="btn-country">Flag Guessing</button>
      <button id="btn-celebrity">Celebrity Guessing</button>
      <button id="btn-car">Car Guessing</button>
    </nav>

    <main>
      <!-- Country -->
      <section id="country-game" class="game">
        <h2>Guess the Country by Flag</h2>
        <img id="flag" alt="Flag" />
        <div class="controls">
          <input type="text" id="country-guess" placeholder="Enter country name" />
          <button id="submit-country">Submit</button>
        </div>
        <p id="country-feedback"></p>
      </section>

      <!-- Celebrity -->
      <section id="celebrity-game" class="game">
        <h2>Guess the Celebrity</h2>
        <img id="celebrity-img" alt="Celebrity" />
        <div class="controls">
          <input type="text" id="celebrity-guess" placeholder="Enter celebrity name" />
          <button id="submit-celebrity">Submit</button>
        </div>
        <p id="celebrity-feedback"></p>
      </section>

      <!-- Car -->
      <section id="car-game" class="game">
        <h2>Guess the Car</h2>
        <img id="car-img" alt="Car" />
        <div class="controls">
          <input type="text" id="car-guess" placeholder="Enter car model" />
          <button id="submit-car">Submit</button>
        </div>
        <p id="car-feedback"></p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
