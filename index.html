<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Cosmo - Menu Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9yIs2zApPDNmboLlSibqDuJcqnunPByLbtA&s" 
             alt="Combo Meal" 
             class="card-image">
        
        <div class="card-content">
            <div class="card-header">
                <h2 class="card-title">Combo Special</h2>
                <p class="card-price">₹200</p>
            </div>
            <p class="card-description">Coffee + sandwich + dessert</p>
        </div>
    </div>
</body>
</html>
